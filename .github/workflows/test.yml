name: Tests

on:
  push:
  pull_request:

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio httpx fastapi pydantic numpy
      - name: Run backend/unit test subset
        run: pytest -q tests -m "not requires_models and not integration"

  distilbert-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install distilbert dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r distilbert-service/requirements.txt pytest
      - name: Run distilbert tests in heuristic mode
        working-directory: distilbert-service
        env:
          DISTILBERT_MODEL_NAME: distilbert-base-uncased
          DISTILBERT_USE_CLASSIFIER: 'false'
        run: pytest -q test_main.py
