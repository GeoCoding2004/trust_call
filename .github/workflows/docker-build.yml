name: Docker Build Validation

on:
  push:
  pull_request:

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RawNet image
        run: docker build -f rawnet-service/Dockerfile -t trust-call-rawnet:ci-test rawnet-service
      - name: Build DistilBERT image
        run: docker build -f distilbert-service/Dockerfile -t trust-call-distilbert:ci-test distilbert-service
      - name: Check backend Dockerfile exists
        id: backend_dockerfile
        run: |
          if [ -f trust_call_backend/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build backend image
        if: steps.backend_dockerfile.outputs.exists == 'true'
        run: docker build -f trust_call_backend/Dockerfile -t trust-call-backend:ci-test .
      - name: Skip backend build when Dockerfile missing
        if: steps.backend_dockerfile.outputs.exists != 'true'
        run: "echo 'Skipping backend image build: trust_call_backend/Dockerfile not found.'"
