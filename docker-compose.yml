services:
  rawnet-service:
    build:
      context: ./rawnet-service
    container_name: trust_call_rawnet
    ports:
      - "8000:8000"
    environment:
      # For real inference, provide/mount model weights at this path.
      RAWNET_MODEL_PATH: /models/fine_tuned_DF_model.pth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  distilbert-service:
    build:
      context: ./distilbert-service
    container_name: trust_call_distilbert
    ports:
      - "8002:8002"
    environment:
      DISTILBERT_MODEL_NAME: ./custom_scam_model
      DISTILBERT_USE_CLASSIFIER: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  trust-call-backend:
    build:
      context: .
      dockerfile: trust_call_backend/Dockerfile
    container_name: trust_call_backend
    network_mode: host
    environment:
      RAWNET_URL: http://127.0.0.1:8000/predict
      DISTILBERT_URL: http://127.0.0.1:8002/predict
      TRUST_CALL_SIGNAL_MIN_RMS: "0.0025"
      TRUST_CALL_SIGNAL_MIN_PEAK: "0.02"
      TRUST_CALL_SIGNAL_MIN_ACTIVE_RATIO: "0.015"
      TRUST_CALL_SEMANTIC_CONTEXT_SECONDS: "8.0"
      TRUST_CALL_WEBRTC_STUN_URL: stun:stun.l.google.com:19302
    depends_on:
      - rawnet-service
      - distilbert-service

  prometheus:
    image: prom/prometheus:latest
    container_name: trust_call_prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - rawnet-service
      - distilbert-service
      - trust-call-backend

  grafana:
    image: grafana/grafana:latest
    container_name: trust_call_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
